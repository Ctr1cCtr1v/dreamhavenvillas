# =====================================================================
#  BOOK DIRECT & SAVE page
#  The booking link itself is set once in hugo.yaml (params.bookingURL).
#  ⚠ Keep every savings claim accurate to what guests actually pay.
# =====================================================================

cta:
  heading: Ready when you are
  text: >-
    Check live availability and reserve directly with our local management
    team. You'll be taken to their secure booking site.
  button: Check Availability & Book

# Side-by-side comparison table. Keep the rows short.
compare:
  heading: Same villa. Better price.
  intro: >-
    Booking sites add their own guest service fee on top of the nightly rate.
    Book with us directly and that fee simply isn't there.
  columns: [Booking sites, Book direct]
  rows:
    - label: The villa
      them: Same home
      us: Same home
    - label: Booking-site service fee
      them: Added at checkout
      us: None
    - label: Talk to the people who know the home
      them: Through an app
      us: Direct line to our local team
    - label: Special requests
      them: Limited
      us: Just ask
  # Optional worked example — add an "example:" line here to show one.

steps:
  heading: How it works
  items:
    - title: Pick your dates
      text: Tap "Book Direct" to see live availability and pricing.
    - title: Book securely
      text: Reserve and pay through our property manager's secure booking site.
    - title: Get ready
      text: You'll receive check-in details and everything you need before you arrive.

reasons:
  heading: Why guests book direct
  items:
    - title: Save on fees
      text: No booking-site guest service fee added to your stay.
    - title: The same home, the same family
      text: Same villa, same professional cleaning, same warm welcome from the family who owns it.
    - title: Real people, real fast
      text: Questions go straight to the local team who manage the villa.
    - title: Come back for less
      text: We offer a discount for returning guests — and for booking direct.

trust:
  heading: Who you're booking with
  text: >-
    Dream Haven Villa isn't owned by a corporation or managed by a company
    with hundreds of properties — it's our family's actual vacation home.
    Day to day, it's cared for by our local property manager, Florida
    Vacation Collection, who handles reservations and payments securely and
    is a phone call away during your stay.

# "Deal Alerts" box on the Book Direct page (links to the /deals/ page)
deals:
  heading: Get deals before anyone else
  text: >-
    Sign up for Deal Alerts and we'll email you last-minute openings,
    seasonal specials and returning-guest offers.
  button: Get Deal Alerts
