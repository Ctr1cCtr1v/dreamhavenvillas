      a: TODO — crib, high chair, pack 'n play?

- group: The Resort
  questions:
    - q: Can we use the Windsor at Westside resort amenities?
      a: >-
        Yes — every community amenity is **included with your stay**, with no
        extra fees. The clubhouse is right across from the front gate, and
        everyone signs a quick waiver the first time they use the pool. You
        can even use it on check-out day before a late flight. See the
        [resort page](/windsor-at-westside/) for hours.
    - q: How far is Disney World?
      a: >-
        About 10 miles to Animal Kingdom, the closest Disney park — roughly
        25–30 minutes by car depending on the park and traffic. You can even
        hear the fireworks from the villa! See the
        [map and drive times](/explore/) for everything nearby.
    - q: Is the community gated?
      a: >-
        Yes. Windsor at Westside has a guarded gate — just show the guard your
        reservation and drive straight to the house.

- group: Getting Here
  questions:
    - q: Which airport should we fly into?
      a: >-
        Orlando International (MCO) has the most flights and is about 35
        miles away — around 45 minutes via the FL-417 toll road.
    - q: Do we need a car?
      a: >-
        We recommend one. The parks, beaches, restaurants and grocery stores
        are all an easy drive — Publix is about 7 minutes away. Uber and Lyft
        also serve the area and usually arrive quickly.
