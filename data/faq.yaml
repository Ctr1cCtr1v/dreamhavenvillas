- group: Booking
  questions:
    - q: Why is booking direct cheaper?
      a: >-
        Booking sites like Airbnb and VRBO add a guest service fee on top of
        the nightly rate. When you book directly with our management team,
        that fee isn't there — and we pass the savings on to you.
    - q: Can I get a discount?
      a: >-
        Yes! We offer a discount for returning guests and for guests who book
        directly through our website.
