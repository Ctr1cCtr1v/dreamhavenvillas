    - q: Can we check in early or check out late?
      a: >-
        Just ask! If there's no quick turnover scheduled, you may be able to
        purchase an early check-in or late check-out, based on availability
        and notice.
    - q: Can I make special requests?
      a: >-
        Absolutely — pool heat, early check-in and more. Let us know a couple
        of days before you arrive.

- group: Your Stay
  questions:
    - q: What time is check-in and check-out?
      a: >-
        Check-in is after **4 PM** and check-out is by **10 AM**. Entry is
        keyless: you'll get your own door code on arrival day, so there are
        no keys to keep track of.
    - q: Is the pool heated?
      a: >-
        Pool heat is available for **$50 per day** for the length of your
        stay — please let us know a couple of days before you arrive. It's
        mostly needed in the winter months; the south-facing pool gets sun
        all day.
    - q: Are linens and towels provided?
      a: >-
        Yes — bed linens, extra pillows and blankets, bath, hand and makeup
        towels, and pool towels. Shampoo, conditioner, body wash and a hair
        dryer are provided too, and there's a washer and dryer with starter
        detergent.
    - q: Is there Wi-Fi?
      a: >-
        Yes, free Wi-Fi throughout the home. The smart TVs are in guest mode,
        so you can log into your own streaming apps and you'll be signed out
        automatically at check-out.
    - q: Are pets allowed?
      a: >-
        Sorry, no. This is a pet-free home so future guests with allergies
        can stay comfortably.
    - q: Where do we park?
      a: >-
        In the driveway, the driveway apron, or on the street in front of the
        house. Please never block the sidewalk or park with tires on the grass —
        the HOA is strict and will fine or tow.
