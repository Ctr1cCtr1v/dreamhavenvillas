intro:
  eyebrow: Your resort
  heading: Private villa. Resort playground.
  text: >-
    Dream Haven Villas sits inside Windsor at Westside, a gated resort
    community in Kissimmee built for vacationing families. Enjoy the privacy
    of your own home and pool, then stroll to a clubhouse packed with ways to
    play — all just minutes from Walt Disney World.
  image: resort/placeholder-clubhouse.jpg

# Perk cards, shown in this order. "image" is optional.
perks:
  - name: Resort Pool & Cabanas
    text: A huge zero-entry resort pool with shaded cabanas and plenty of loungers.   # verify
    image: resort/placeholder-resort-pool.jpg

  - name: Lazy River
    text: Grab a float and drift around the resort pool on the lazy river.   # verify
    image: resort/placeholder-lazy-river.jpg

  - name: Water Slides & Splash Park
    text: Slides, water shoots and a splash park the kids won't want to leave.   # verify
    image: resort/placeholder-resort-pool.jpg

  - name: Fitness Center
    text: Keep up your routine with a fully equipped fitness center.   # verify
    image: resort/placeholder-fitness.jpg

  - name: Sports Courts
    text: Tennis, basketball and volleyball courts for a little friendly competition.   # verify
    image: resort/placeholder-clubhouse.jpg

  - name: Bar & Lounge
    text: Poolside drinks and bites at the clubhouse bar and lounge.   # verify name & hours
    image: resort/placeholder-clubhouse.jpg

  - name: Ice Cream & Market
    text: An ice cream parlor for treats and a sundry shop for the essentials.   # verify
    image: resort/placeholder-clubhouse.jpg

  - name: Kids' Arcade & Playground
    text: An indoor arcade and outdoor playground for younger guests.   # verify
    image: resort/placeholder-clubhouse.jpg

