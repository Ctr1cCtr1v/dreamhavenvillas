house_rules:
  - No smoking or vaping anywhere on the property, including the garage and pool area.
  - No pets — this is a pet-free home for guests with allergies.
  - No parties. This is a family vacation home, not a party house.
  - Community quiet hours are 10 PM to 7 AM.
  - Park only in the driveway or on the street — never blocking the sidewalk (the HOA fines and tows).
  - No tape or adhesive on walls or doors. Use the banner holder for celebrations!
  - Life happens! Please report any damage right away.
