# =====================================================================
#  THE VILLA — property details page
#  Delete a line entirely to hide it on the site.
#  Photos: paths inside assets/images/ — the FIRST photo is the big one.
#  Facts come from the Dream Haven Welcome Book and the home's 2026 sale
#  listing. Lines marked "# verify" still need a quick check.
# =====================================================================

# Key numbers bar at the top of the page (order = order shown)
stats:
  - { value: "8",     label: Bedrooms }
  - { value: "6",     label: Bathrooms }
  - { value: "16",    label: Sleeps }
  - { value: "4,041", label: Sq Ft }
  - { value: "Pool & Spa", label: Private }   # heat available on request
  - { value: Gated,   label: Resort }

overview:
  heading: Our family's home, ready for yours
  # Separate paragraphs with a blank line.
  text: |-
    Dream Haven Villa is our family's own vacation home, not a corporate
    rental. It's where we make memories with our kids, and we hope you'll
    feel like you're staying in the home of a friend.

    Spread across two floors and more than 4,000 square feet, the villa has
    two huge indoor gathering areas, an outdoor dining area by a sunny,
    south-facing pool and spa, eight bedrooms and six full bathrooms. The
    king primary suite and a queen room are on the main floor, so
    grandparents can skip the stairs, and the kids' Cars and Moana rooms are
    waiting upstairs.

# ---------------------------------------------------------------------
#  SHARED SPACES — living areas, kitchen, game room, outdoors.
#  Copy a block (from "- name:" down) to add another space.
# ---------------------------------------------------------------------
spaces:
  - name: Living Room
    tagline: Gather, relax, and plan tomorrow's adventure
    floor: First floor
    description: >-
      A main-floor living room with a large sectional and an 85-inch TV,
      open to the kitchen. Log into your own streaming apps — the TVs are in
      guest mode, so you're signed out automatically at check-out.
    features: [Large sectional, 85-inch TV, Open to the kitchen]
    photos:
      - living/01-living-room.jpg
      - living/02-living-room-kitchen.jpg

  - name: Kitchen & Coffee Bar
    tagline: Family feasts, made easy
    floor: First floor
    description: >-
      A fully equipped kitchen for big family breakfasts and dinners in,
      right down to the Mickey and Minnie waffle makers. The dining table
      seats 12, with 4 more seats at the island. Start every morning at the
      coffee bar.
    features:
      - Dining table seats 12
      - Island seats 4
      - Coffee bar with Keurig & two drip makers
      - Mickey & Minnie waffle makers
      - Dishwasher & garbage disposal
      - Pots, pans & cooking utensils
    photos:
      - kitchen/01-kitchen.jpg
      - kitchen/04-dining-table.jpg
      - kitchen/03-kitchen-counters.jpg
      - kitchen/05-dining-room.jpg
      - kitchen/08-coffee-station.jpg
      - kitchen/09-coffee-bar.jpg

  - name: Game Room
    tagline: Where friendly rivalries begin
    floor: First floor
    description: >-
      Air hockey and a big TV for family tournaments — and more games are on
      the way.
    features: [Air hockey table, Big-screen TV]
    photos:
      - game-room/01-game-room.jpg
      - game-room/02-game-room-tv.jpg
      - game-room/03-air-hockey.jpg

  - name: Upstairs Loft
    tagline: Movie nights and game nights, upstairs
    floor: Second floor
    description: >-
      An upstairs living room at the top of the stairs. Sink into the large
      sectional for a Disney movie night on the 85-inch TV, surrounded by
      Disney movie posters, or pull a game from the closet and settle in at
      the games table.
    features:
      - Large sectional
      - 85-inch TV
      - Games table
      - Closet full of board games
      - Disney movie posters
    photos:
      - living/03-loft.jpg
      - living/04-loft-sectional.jpg
      - living/05-loft-games-table.jpg

  - name: Pool & Lanai
    tagline: Your own private resort
    floor: Outdoors
    description: >-
      Your private screened pool and spa face south, so they get sun all day.
      Heat is available on request for winter swims (the spa shares the
      pool's temperature). Lounge on the pool loungers and the poolside
      sectional, dine at the outdoor table for six, or play a game of
      cornhole. A pool door alarm and safety fence come set up on arrival.
    features:
      - Private pool & spa
      - South-facing, sun all day
      - Heated on request ($50/day)
      - Screened enclosure
      - Outdoor dining table for six
      - Outdoor sectional
      - Poolside sectional & loungers
      - Cornhole
      - Pool safety fence & door alarm
    photos:
      - pool/01-pool-and-spa.jpg
      - pool/02-pool-sunset.jpg
      - pool/04-lanai-dining.jpg
      - pool/05-lanai-sectional.jpg
      - pool/03-pool-wide.jpg
      - pool/10-loungers.jpg

