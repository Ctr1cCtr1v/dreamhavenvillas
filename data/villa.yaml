# Key numbers bar at the top of the page (order = order shown)
stats:
  - { value: "8",     label: Bedrooms }
  - { value: "6",     label: Bathrooms }
  - { value: "16",    label: Sleeps }        # verify: max occupancy
  - { value: "4,041", label: Sq Ft }
  - { value: Private, label: Heated Pool }   # heat available on request
  - { value: Gated,   label: Resort }

overview:
  heading: Our family's home, ready for yours
  # Separate paragraphs with a blank line.
  text: |-
    Dream Haven Villa is our family's own vacation home, not a corporate
    rental. It's where we make memories with our kids, and we hope you'll
    feel like you're staying in the home of a friend.

    Spread across two floors and more than 4,000 square feet, the villa has
    two huge indoor gathering areas, an outdoor dining area by a sunny,
    south-facing pool, eight bedrooms and six full bathrooms. The primary
    suite and a second king room are on the main floor, so grandparents can
    skip the stairs, and the kids' themed bedrooms are waiting upstairs.

# ---------------------------------------------------------------------
#  SHARED SPACES — living areas, kitchen, game room, outdoors.
#  Copy a block (from "- name:" down) to add another space.
# ---------------------------------------------------------------------
spaces:
  - name: Living Room
    tagline: Gather, relax, and plan tomorrow's adventure
    floor: First floor
    description: >-
      An open, comfortable living space with plenty of seating and a big
      smart TV. Log into your own streaming apps — the TVs are in guest mode,
      so you're signed out automatically at check-out.
    features: [Large smart TV, Stream your own apps, Open to the kitchen]   # verify
    photos:
      - living/placeholder-living-1.jpg
      - living/placeholder-living-2.jpg
      - living/placeholder-living-3.jpg

  - name: Kitchen & Coffee Bar
    tagline: Family feasts, made easy
    floor: First floor
    description: >-
      A fully equipped kitchen with everything you need for big family
      breakfasts and dinners in — right down to the Mickey and Minnie waffle
      makers. Start every morning at the coffee bar.
    features:
      - Coffee bar with Keurig & two drip makers
      - Mickey & Minnie waffle makers
      - Dishwasher & garbage disposal
      - Pots, pans & cooking utensils
    photos:
      - kitchen/placeholder-kitchen-1.jpg
      - kitchen/placeholder-kitchen-2.jpg
      - kitchen/placeholder-dining.jpg

  - name: Game Room
    tagline: Where friendly rivalries begin
    floor: First floor
    description: >-
      A video-game themed game room built for family tournaments, with a
      game table and big TVs. TODO: list the games.
    features: [Game table, Big-screen TV, TODO game]
    photos:
      - game-room/placeholder-game-room-1.jpg
      - game-room/placeholder-game-room-2.jpg

  - name: Upstairs Loft
    tagline: Movie nights, upstairs
    floor: Second floor
    description: >-
      A second huge gathering space at the top of the stairs for lounging,
      board games and movie nights. TODO: describe the seating and TV.
    features: [TODO feature, TODO feature]
    photos:
      - living/placeholder-loft-1.jpg
      - living/placeholder-loft-2.jpg

  - name: Pool & Lanai
    tagline: Your own private resort
    floor: Outdoors
    description: >-
      Your private screened pool faces south, so it gets sun all day. Pool
      heat is available on request for winter swims, and the covered lanai
      has an outdoor dining area for long evenings by the water. A pool door
      alarm and safety fence come set up on arrival.
    features:
      - South-facing, sun all day
      - Heated on request ($50/day)
      - Screened enclosure
      - Outdoor dining area
      - Pool safety fence & door alarm
    photos:
      - pool/placeholder-pool-1.jpg
