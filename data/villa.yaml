overview:
  heading: A home built for big getaways
  # Separate paragraphs with a blank line.
  text: |-
    Built in 2018 and spread across two floors and more than 4,000 square
    feet, Dream Haven Villas has room for the whole crew: eight bedrooms, six
    full bathrooms, an open-plan living, kitchen and dining space, and a
    screened pool and spa just outside.

    The primary suite and a second bedroom are on the main floor, so
    grandparents can skip the stairs. Upstairs, the rest of the bedrooms
    gather around a loft made for movie nights, and kids will head straight
    for the game room. TODO: check this description and make it yours.

